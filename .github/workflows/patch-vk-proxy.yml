name: Use relative Worker endpoint

on:
  push:
    branches: [main]
    paths:
      - 'proxy-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old = "const VK_UPLOAD_PROXY = 'https://cinema-moment-vk-proxy.shebarshov2202.workers.dev/vk-upload';"
          new = "const VK_UPLOAD_PROXY = '/vk-upload';"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('VK_UPLOAD_PROXY constant not found')

          old_msg = "if (/Failed to fetch|NetworkError|CORS/i.test(text)) log(`Сетевой сбой. origin=${location.origin}, proxy=${VK_UPLOAD_PROXY}`);"
          new_msg = "if (/Failed to fetch|NetworkError|CORS/i.test(text)) log(`Сетевой сбой same-origin. origin=${location.origin}, proxy=${VK_UPLOAD_PROXY}`);"
          s = s.replace(old_msg, new_msg)

          path.write_text(s, encoding='utf-8')

      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Cinema Moment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Use relative Worker upload route"
          git push
