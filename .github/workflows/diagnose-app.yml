name: Diagnose app JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'diagnose-trigger.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract module script
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script type="module">(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('module script not found')
          js = m.group(1)
          # Node cannot resolve https imports in --check, but syntax checking does not need resolution.
          Path('/tmp/app.mjs').write_text(js, encoding='utf-8')
          ids = set(re.findall(r'id="([^"]+)"', s))
          refs = set(re.findall(r"\$\('([^']+)'\)", js))
          missing = sorted(refs - ids)
          print('DOM ids referenced but missing:', missing)
          if missing:
              raise SystemExit(2)
      - name: JavaScript syntax check
        run: node --check /tmp/app.mjs
