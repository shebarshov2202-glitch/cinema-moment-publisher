name: Inline VK Bridge

on:
  push:
    branches: [main]
    paths:
      - 'inline-bridge-trigger-2.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace external VK Bridge import
        shell: python
        run: |
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "import bridge from 'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.14.0/+esm';"
          encoded = ""
          new = base64.b64decode(encoded).decode('utf-8')
          if old not in s:
              raise SystemExit('external bridge import not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Extract module
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script type="module">(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('module not found')
          Path('/tmp/app.mjs').write_text(m.group(1), encoding='utf-8')
      - name: Syntax check
        run: node --check /tmp/app.mjs
      - name: Commit
        run: |
          git config user.name "Cinema Moment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Inline VK Bridge to avoid CDN init failures"
          git push
