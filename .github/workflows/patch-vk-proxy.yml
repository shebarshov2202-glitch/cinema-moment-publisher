name: Add VK API diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'proxy-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          start = s.find('function errorText(error) {')
          end = s.find('\n}\n\nfunction buildMessage', start)
          if start < 0 or end < 0:
              raise SystemExit('errorText block not found')
          end += 2
          error_block = '''function errorText(error) {
            if (!error) return 'Неизвестная ошибка';
            const data = error?.error_data || error || {};
            const msg = data?.error_reason || data?.error_msg || error?.error_msg || error?.message || String(error);
            const code = data?.error_code ?? error?.error_code;
            const subcode = data?.error_subcode ?? data?.subcode ?? error?.error_subcode;
            const method = error?.vk_method;
            return [method ? `VK ${method}` : '', code != null ? `code=${code}` : '', subcode != null ? `subcode=${subcode}` : '', msg].filter(Boolean).join(' · ');
          }'''
          s = s[:start] + error_block + s[end:]

          start = s.find('async function api(method,params={}) {')
          end = s.find('\n}\n\nasync function init()', start)
          if start < 0 or end < 0:
              raise SystemExit('api block not found')
          end += 2
          api_block = '''async function api(method,params={}) {
            if (!accessToken) throw new Error('Нет пользовательского токена VK.');
            try {
              const result = await bridge.send('VKWebAppCallAPIMethod',{
                method,
                params:{ ...params,access_token:accessToken,v:VK_API_VERSION }
              });
              return result?.response ?? result;
            } catch (error) {
              try { error.vk_method = method; } catch (_) {}
              log(`VK API ERROR ${method}: ${errorText(error)}`);
              try { log(`VK RAW ${method}: ${JSON.stringify(error)}`); } catch (_) {}
              throw error;
            }
          }'''
          s = s[:start] + api_block + s[end:]

          marker = "const saved = await api('photos.saveWallPhoto',{"
          if marker in s and 'сохраняю через photos.saveWallPhoto' not in s:
              s = s.replace(marker, "log(`Фото ${index}: сохраняю через photos.saveWallPhoto…`);\n  " + marker, 1)

          marker2 = "if (!photo?.owner_id || !photo?.id) throw new Error(`Фото ${index}: photos.saveWallPhoto не вернул ID.`);"
          if marker2 in s and 'photos.saveWallPhoto OK' not in s:
              s = s.replace(marker2, marker2 + "\n  log(`Фото ${index}: photos.saveWallPhoto OK → photo${photo.owner_id}_${photo.id}`);", 1)

          marker3 = "const result = await api('wall.post',{"
          if marker3 in s and 'Вызываю wall.post' not in s:
              s = s.replace(marker3, "log(`Вызываю wall.post: owner_id=${-Math.abs(groupId)}, from_group=1, publish_date=${publishDate}, attachments=${attachments.length}`);\n    " + marker3, 1)

          path.write_text(s, encoding='utf-8')

      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Cinema Moment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add detailed VK API diagnostics"
          git push
