name: Direct browser wall.post

on:
  push:
    branches: [main]
    paths:
      - 'direct-browser-wall-post-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Netlify publisher
        shell: python
        run: |
          from pathlib import Path
          p = Path('cloudflare-pages/public/index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ("const VK_PUBLISH_PROXY = '/vk-publish';",
             "const VK_PUBLISH_PROXY = 'https://api.vk.com/method/wall.post';"),
            ("log(`Вызываю server-side wall.post с пользовательским токеном: owner_id=${-Math.abs(groupId)}, publish_date=${publishDate}, attachments=${attachments.length}`);",
             "log(`Вызываю wall.post напрямую из браузера: owner_id=${-Math.abs(groupId)}, publish_date=${publishDate}, attachments=${attachments.length}`);"),
            ("if (!publishResponse.ok) throw new Error(`VK publish proxy HTTP ${publishResponse.status} — ${publishText.slice(0,300)}`);",
             "if (!publishResponse.ok) throw new Error(`VK API HTTP ${publishResponse.status} — ${publishText.slice(0,300)}`);"),
            ("catch (_) { throw new Error(`VK publish proxy вернул не JSON: ${publishText.slice(0,300)}`); }",
             "catch (_) { throw new Error(`VK API вернул не JSON: ${publishText.slice(0,300)}`); }")
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'pattern not found: {old[:140]}')
            s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Syntax check
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('cloudflare-pages/public/index.html').read_text(encoding='utf-8')
          m = re.search(r'<script type="module">(.*?)</script>', s, re.S)
          if not m:
            raise SystemExit('module script not found')
          Path('/tmp/app.mjs').write_text(m.group(1), encoding='utf-8')

      - run: node --check /tmp/app.mjs

      - name: Commit
        run: |
          git config user.name "Cinema Moment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare-pages/public/index.html
          git commit -m "Call wall.post directly from browser"
          git push
