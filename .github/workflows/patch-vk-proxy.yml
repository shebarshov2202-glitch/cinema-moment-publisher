name: Patch remote image upload

on:
  push:
    branches: [main]
    paths:
      - 'proxy-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          start = s.find("async function uploadOnePhoto(file,groupId,index) {")
          end = s.find("\npublishBtn.addEventListener('click',async () => {", start)
          if start < 0 or end < 0:
              raise SystemExit('uploadOnePhoto block not found')

          replacement = base64.b64decode('').decode('utf-8')
          s = s[:start] + replacement + s[end:]

          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          if old not in s:
              raise SystemExit('publish upload loop not found')
          s = s.replace(old,new,1)

          old_msg = "if (/Failed to fetch|NetworkError|CORS/i.test(text)) log('Ошибка сети при обращении к Cloudflare Worker. Проверь его адрес и статус Deploy.');"
          new_msg = "if (/Failed to fetch|NetworkError|CORS/i.test(text)) log(`Сетевой сбой. origin=${location.origin}, proxy=${VK_UPLOAD_PROXY}`);"
          s = s.replace(old_msg,new_msg)

          path.write_text(s,encoding='utf-8')

      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Cinema Moment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Let Worker fetch remote movie frames"
          git push
