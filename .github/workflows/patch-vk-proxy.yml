name: Patch VK upload proxy

on:
  push:
    branches: [main]
    paths:
      - '.proxy-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          proxy_const = "const VK_UPLOAD_PROXY = 'https://cinema-moment-vk-proxy.shebarshov2202.workers.dev/vk-upload';"
          if proxy_const not in s:
              anchor = "const KP_API = 'https://kinopoiskapiunofficial.tech/api';"
              if anchor not in s:
                  raise SystemExit('KP_API anchor not found')
              s = s.replace(anchor, anchor + "\n" + proxy_const, 1)

          old = "const uploadResponse = await fetch(server.upload_url,{ method:'POST',body:form });"
          new = "form.append('upload_url',server.upload_url);\n  log(`Фото ${index}: отправляю через Cloudflare Worker…`);\n  const uploadResponse = await fetch(VK_UPLOAD_PROXY,{ method:'POST',body:form });"
          if old in s:
              s = s.replace(old, new, 1)
          elif "fetch(VK_UPLOAD_PROXY" not in s:
              raise SystemExit('Direct VK upload line not found')

          old_cors = "if (/Failed to fetch|NetworkError|CORS/i.test(text)) log('Похоже на CORS. Тогда следующим шагом добавим серверный прокси, без установки программ на компьютер.');"
          new_cors = "if (/Failed to fetch|NetworkError|CORS/i.test(text)) log('Ошибка сети при обращении к Cloudflare Worker. Проверь его адрес и статус Deploy.');"
          s = s.replace(old_cors, new_cors)

          path.write_text(s, encoding='utf-8')

      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Cinema Moment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Route VK photo uploads through Cloudflare Worker"
          git push
