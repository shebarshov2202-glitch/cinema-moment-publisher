name: Use user token for wall.post

on:
  push:
    branches: [main]
    paths:
      - 'user-token-publish-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch actual Netlify publisher
        run: python patch_netlify_wallpost.py
      - name: Commit
        run: |
          git config user.name "Cinema Moment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare-pages/public/index.html
          git commit -m "Call wall.post directly from browser"
          git push
