name: Patch Netlify direct browser wall.post

on:
  push:
    branches: [main]
    paths:
      - 'netlify-direct-wallpost-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch the actual Netlify index
        shell: python
        run: |
          from pathlib import Path

          p = Path('cloudflare-pages/public/index.html')
          s = p.read_text(encoding='utf-8')

          old = r'''    log(`Вызываю server-side wall.post с пользовательским токеном: owner_id=${-Math.abs(groupId)}, publish_date=${publishDate}, attachments=${attachments.length}`);
    const body = new URLSearchParams();
    body.set('access_token',accessToken);
    body.set('owner_id',String(-Math.abs(groupId)));
    body.set('from_group','1');
    body.set('signed','0');
    body.set('message',message);
    body.set('attachments',attachments.join(','));
    body.set('publish_date',String(publishDate));
    body.set('v',VK_API_VERSION);
    const publishResponse = await fetch(VK_PUBLISH_PROXY,{
      method:'POST',
      headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' },
      body
    });
    const publishText = await publishResponse.text();
    if (!publishResponse.ok) throw new Error(`VK publish proxy HTTP ${publishResponse.status} — ${publishText.slice(0,300)}`);
    let publishJson;
    try { publishJson = JSON.parse(publishText); }
    catch (_) { throw new Error(`VK publish proxy вернул не JSON: ${publishText.slice(0,300)}`); }
    if (publishJson?.error) throw new Error(`VK wall.post · code=${publishJson.error.error_code} · ${publishJson.error.error_msg}`);
    const result = publishJson?.response;
    const postId = result?.post_id ?? result;
'''

          new = r'''    log(`Вызываю wall.post напрямую из браузера: owner_id=${-Math.abs(groupId)}, publish_date=${publishDate}, attachments=${attachments.length}`);
    const body = new URLSearchParams();
    body.set('access_token',accessToken);
    body.set('owner_id',String(-Math.abs(groupId)));
    body.set('from_group','1');
    body.set('signed','0');
    body.set('message',message);
    body.set('attachments',attachments.join(','));
    body.set('publish_date',String(publishDate));
    body.set('v',VK_API_VERSION);

    const controller = new AbortController();
    const publishTimer = setTimeout(() => controller.abort(), 20000);
    let publishResponse;
    try {
      publishResponse = await fetch('https://api.vk.com/method/wall.post',{
        method:'POST',
        headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' },
        body,
        signal:controller.signal,
        credentials:'omit'
      });
    } catch (error) {
      if (error?.name === 'AbortError') throw new Error('wall.post: VK не ответил за 20 секунд.');
      throw new Error(`wall.post: сетевой запрос из браузера не прошёл — ${errorText(error)}`);
    } finally {
      clearTimeout(publishTimer);
    }

    const publishText = await publishResponse.text();
    if (!publishResponse.ok) throw new Error(`VK wall.post HTTP ${publishResponse.status} — ${publishText.slice(0,300)}`);
    let publishJson;
    try { publishJson = JSON.parse(publishText); }
    catch (_) { throw new Error(`VK wall.post вернул не JSON: ${publishText.slice(0,300)}`); }
    if (publishJson?.error) throw new Error(`VK wall.post · code=${publishJson.error.error_code} · ${publishJson.error.error_msg}`);
    const result = publishJson?.response;
    const postId = result?.post_id ?? result;
'''

          if old not in s:
            raise SystemExit('Old server-side wall.post block not found in cloudflare-pages/public/index.html')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        shell: python
        run: |
          from pathlib import Path
          s = Path('cloudflare-pages/public/index.html').read_text(encoding='utf-8')
          assert 'Вызываю wall.post напрямую из браузера' in s
          assert 'Вызываю server-side wall.post с пользовательским токеном' not in s
          assert "fetch('https://api.vk.com/method/wall.post'" in s
          assert '20000' in s

      - name: Commit
        run: |
          git config user.name "Cinema Moment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare-pages/public/index.html
          git commit -m "Publish wall.post directly from Netlify browser app"
          git push
